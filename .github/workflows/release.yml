name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      - name: Typecheck
        run: npm run typecheck

      - name: Build and package NSIS
        env:
          # 只在本步骤注入；不会出现在源码、日志或普通 PR 中。
          WINDLETTER_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          WINDLETTER_DEFAULT_UPDATE_FEED: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: npm run dist

      - name: Generate update manifest
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${VERSION}" >&2
            exit 1
          fi
          INSTALLER="release/月月月启动器-${VERSION}-setup.exe"
          test -f "$INSTALLER"
          ASSET_NAME=$(node -e "console.log(encodeURIComponent(require('path').basename(process.argv[1])))" "$INSTALLER")
          ASSET="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ASSET_NAME}"
          npm run update:manifest -- "$INSTALLER" \
            --version "$VERSION" \
            --notes-file build/update-notes.txt \
            --out release/latest.json \
            --base "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            --mirror "https://ghfast.top/${ASSET}" \
            --mirror "https://gh-proxy.com/${ASSET}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          INSTALLER="release/月月月启动器-${VERSION}-setup.exe"
          gh release create "$GITHUB_REF_NAME" \
            "$INSTALLER" release/latest.json \
            --title "月月月启动器 ${VERSION}" \
            --notes-file build/update-notes.txt
